name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        run: node -e 'const pkg = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) process.exit(1)'
      - run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@fiscalrail/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm publish
